<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grid Visualization</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/chart.css" />

</head>
<body>
<div class="header"></div>
<div class="container">
  <svg id="grid"></svg>

  <div class="controls">
    <label for="orderSelect">Order By:</label>
    <select id="orderSelect">
      <option value="none">Original</option>
      <option value="dateEx">Date</option>
      <option value="age">Age (Decades)</option>
      <option value="sex">Sex</option>
      <option value="race">Race</option>
    </select>

    <label for="colorSelect">Color By:</label>
    <select id="colorSelect">
      <option value="dateEx">Date</option>
      <option value="age">Age (Decades)</option>
      <option value="sex">Sex</option>
      <option value="race">Race</option>
    </select>
  </div>
  <div class="hover-tooltip" id="tooltip"></div>
  <div class="statement-pop" style="display: none;">
    <div class="statement-header">
      <div class="tooltip-title" id="statement-name-id"></div>
      <div class="inmate-no" id="statement-no-id" style="margin-left: 8px;"></div>
      <div class="spacer"></div>
      <button class="pop-close-button" id="pop-close-button-id"><img src="./assets/icons/Icon_x.svg" class = "icon"></button>
    </div>
    <div class="statement-content">
    </div>
  </div>
  <div class="statement-pop-blanket" style="display: none;"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module" src="./js/main.js"></script>

</body>
</html>
