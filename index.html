<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Texas Last Words</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/chart.css" />

</head>
<body>
<div class="header"></div>
<div class="container">
  <div class="grid-container">
    <div class="grid-title" id="grid-title-id"></div>
    <svg id="grid"></svg>
  </div>
  <div class="control-container">
    <div class="controls">
      <div class="dropdown" id="dropdown-order">
        <div class="drop-label">Sort By</div>
        <div class="dropdown-button" id="dropdownButton-order">
            <div>None</div>
            <img src="./assets/icons/Icon_arrowDown.svg" class = "icon">
        </div>
        <div class="dropdown-content" id="dropdownContent-order">
          <!-- <div value="none">None</div> -->
          <div value="dateEx">Date</div>
          <div value="age">Age</div>
          <div value="sex">Sex</div>
          <div value="race">Race</div>
          <div value="stmt_len">Statement Length</div>
          <div class="divid-line"></div>  
          <div value="innocent">Innocence Claim</div>
        </div>
      </div>
      <div class="dropdown" id="dropdown-color">
        <div class="drop-label">Color By</div>
        <div class="dropdown-button" id="dropdownButton-color">
            <div>None</div>
            <img src="./assets/icons/Icon_arrowDown.svg" class = "icon">
        </div>
        <div class="dropdown-content" id="dropdownContent-color">
          <!-- <div value="none">None</div> -->
          <div value="dateEx">Date</div>
          <div value="age">Age</div>
          <div value="sex">Sex</div>
          <div value="race">Race</div>
          <div value="stmt_len">Statement Length</div>
          <div class="divid-line"></div>  
          <div value="innocent">Innocence Claim</div>
          <div class="divid-line"></div>  
          <div value="photo">Inmate Photo</div>
        </div>
      </div>
    </div>
    <div class="legend-container">
      <div class="legend-title" id="legend-title-id"></div>
      <div class="legend" id="color-by-legend"></div>
    </div>
  </div>
  <div class="hover-tooltip" id="tooltip"></div>
  <div class="statement-pop" style="display: none;">
    <div class="statement-header">
      <div class="tooltip-title" id="statement-name-id"></div>
      <div class="inmate-no" id="statement-no-id" style="margin-left: 8px;"></div>
      <div class="spacer"></div>
      <button class="pop-close-button" id="pop-close-button-id"><img src="./assets/icons/Icon_x.svg" class = "icon"></button>
    </div>
    <div class="statement-content">
    </div>
  </div>
  <div class="statement-pop-blanket" style="display: none;"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module" src="./js/main.js"></script>

</body>
</html>
